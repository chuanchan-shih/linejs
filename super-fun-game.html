<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🚀 太空閃躲者 - Space Dodger</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Arial', sans-serif;
        }

        .container {
            text-align: center;
            background: rgba(0, 0, 0, 0.3);
            padding: 20px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
        }

        h1 {
            color: #fff;
            margin-bottom: 10px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }

        canvas {
            border: 5px solid #fff;
            display: block;
            background: linear-gradient(to bottom, #1a1a2e 0%, #16213e 100%);
            cursor: crosshair;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.5);
            border-radius: 10px;
            margin: 20px auto;
        }

        .info {
            display: flex;
            justify-content: space-around;
            color: #fff;
            font-size: 1.3em;
            margin-bottom: 15px;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
        }

        .score, .level, .hp {
            font-weight: bold;
        }

        .controls {
            color: #fff;
            margin-top: 15px;
            font-size: 0.9em;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
        }

        button {
            margin-top: 15px;
            padding: 12px 30px;
            font-size: 1.1em;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .game-over {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.95);
            color: #fff;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            display: none;
            z-index: 1000;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.8);
        }

        .game-over h2 {
            font-size: 2.5em;
            margin-bottom: 20px;
            color: #ff6b6b;
        }

        .game-over p {
            font-size: 1.2em;
            margin: 10px 0;
        }

        .game-over button {
            margin-top: 20px;
        }

        .emoji {
            font-size: 1.2em;
            display: inline-block;
        }

        .tip {
            color: #ffd700;
            font-size: 0.85em;
            margin-top: 10px;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 太空閃躲者</h1>
        <div class="info">
            <div>分數: <span class="score">0</span></div>
            <div>等級: <span class="level">1</span></div>
            <div>生命: <span class="hp">❤️ ❤️ ❤️</span></div>
        </div>
        <canvas id="gameCanvas" width="600" height="600"></canvas>
        <div class="controls">
            <p>🖱️ 移動滑鼠控制太空船</p>
            <p>⭐ 收集金星加分 | ⚠️ 閃躲隕石</p>
        </div>
        <button onclick="location.reload()">🔄 重新開始</button>
        <div class="tip">💡 等級越高隕石越多越快！</div>
    </div>

    <div class="game-over" id="gameOverScreen">
        <h2 id="gameOverTitle">遊戲結束 😢</h2>
        <p>最終分數: <strong id="finalScore">0</strong></p>
        <p>達到等級: <strong id="finalLevel">1</strong></p>
        <button onclick="location.reload()">再玩一次 🎮</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // 遊戲狀態
        const game = {
            running: true,
            score: 0,
            level: 1,
            hp: 3,
            maxHp: 3,
            playerX: canvas.width / 2,
            playerY: canvas.height - 50,
            playerSize: 30,
            playerSpeed: 6,
        };

        // 粒子效果
        const particles = [];
        class Particle {
            constructor(x, y, vx, vy, color, life = 30) {
                this.x = x;
                this.y = y;
                this.vx = vx;
                this.vy = vy;
                this.color = color;
                this.life = life;
                this.maxLife = life;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vy += 0.2;
                this.life--;
            }

            draw() {
                const alpha = this.life / this.maxLife;
                ctx.fillStyle = this.color.replace(')', `, ${alpha})`).replace('rgb', 'rgba');
                ctx.beginPath();
                ctx.arc(this.x, this.y, 3, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // 障礙物 (隕石)
        const obstacles = [];
        class Obstacle {
            constructor() {
                this.x = Math.random() * (canvas.width - 40);
                this.y = -40;
                this.size = 30 + Math.random() * 20;
                this.speed = 2 + game.level * 0.5;
                this.rotation = Math.random() * Math.PI * 2;
                this.rotationSpeed = (Math.random() - 0.5) * 0.1;
            }

            update() {
                this.y += this.speed;
                this.rotation += this.rotationSpeed;
            }

            draw() {
                ctx.save();
                ctx.translate(this.x + this.size / 2, this.y + this.size / 2);
                ctx.rotate(this.rotation);

                ctx.fillStyle = '#ff6b6b';
                ctx.beginPath();
                for (let i = 0; i < 6; i++) {
                    const angle = (i / 6) * Math.PI * 2;
                    const x = Math.cos(angle) * this.size / 2;
                    const y = Math.sin(angle) * this.size / 2;
                    if (i === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }
                ctx.closePath();
                ctx.fill();
                ctx.strokeStyle = '#ff4757';
                ctx.lineWidth = 2;
                ctx.stroke();

                ctx.restore();
            }

            collidesWith(playerX, playerY, playerSize) {
                const dx = (this.x + this.size / 2) - playerX;
                const dy = (this.y + this.size / 2) - playerY;
                const distance = Math.sqrt(dx * dx + dy * dy);
                return distance < (this.size / 2 + playerSize / 2);
            }
        }

        // 獎勵 (星星)
        const rewards = [];
        class Reward {
            constructor() {
                this.x = Math.random() * (canvas.width - 30);
                this.y = -30;
                this.size = 20;
                this.speed = 1.5;
                this.rotation = 0;
                this.wobble = Math.random() * Math.PI * 2;
                this.wobbleSpeed = 0.05;
            }

            update() {
                this.y += this.speed;
                this.wobble += this.wobbleSpeed;
                this.x += Math.sin(this.wobble) * 0.5;
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.fillStyle = '#ffd700';
                ctx.beginPath();
                for (let i = 0; i < 5; i++) {
                    const angle = (i / 5) * Math.PI * 2 - Math.PI / 2;
                    const x = Math.cos(angle) * this.size;
                    const y = Math.sin(angle) * this.size;
                    if (i === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);

                    const innerAngle = angle + Math.PI / 5;
                    const ix = Math.cos(innerAngle) * (this.size / 2);
                    const iy = Math.sin(innerAngle) * (this.size / 2);
                    ctx.lineTo(ix, iy);
                }
                ctx.closePath();
                ctx.fill();
                ctx.strokeStyle = '#ffaa00';
                ctx.lineWidth = 2;
                ctx.stroke();

                ctx.restore();
            }

            collidesWith(playerX, playerY, playerSize) {
                const dx = this.x - playerX;
                const dy = this.y - playerY;
                const distance = Math.sqrt(dx * dx + dy * dy);
                return distance < (this.size + playerSize / 2);
            }
        }

        // 玩家 (太空船)
        function drawPlayer() {
            ctx.save();
            ctx.translate(game.playerX, game.playerY);

            // 船身
            ctx.fillStyle = '#00ffff';
            ctx.beginPath();
            ctx.moveTo(0, -25);
            ctx.lineTo(15, 20);
            ctx.lineTo(0, 10);
            ctx.lineTo(-15, 20);
            ctx.closePath();
            ctx.fill();

            ctx.strokeStyle = '#00aa88';
            ctx.lineWidth = 2;
            ctx.stroke();

            // 火焰
            const flameHeight = 15 + Math.sin(Date.now() / 50) * 5;
            ctx.fillStyle = 'rgba(255, 100, 0, 0.7)';
            ctx.beginPath();
            ctx.moveTo(-8, 10);
            ctx.lineTo(-3, 10 + flameHeight);
            ctx.lineTo(0, 15);
            ctx.lineTo(3, 10 + flameHeight);
            ctx.lineTo(8, 10);
            ctx.closePath();
            ctx.fill();

            ctx.restore();
        }

        // 滑鼠移動控制
        document.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            game.playerX = Math.max(game.playerSize / 2,
                Math.min(canvas.width - game.playerSize / 2, e.clientX - rect.left));
        });

        // 觸屏支持
        document.addEventListener('touchmove', (e) => {
            const rect = canvas.getBoundingClientRect();
            const touch = e.touches[0];
            game.playerX = Math.max(game.playerSize / 2,
                Math.min(canvas.width - game.playerSize / 2, touch.clientX - rect.left));
        }, { passive: true });

        // 更新分數和HP顯示
        function updateUI() {
            document.querySelector('.score').textContent = game.score;
            document.querySelector('.level').textContent = game.level;
            let hpDisplay = '';
            for (let i = 0; i < game.hp; i++) hpDisplay += '❤️ ';
            document.querySelector('.hp').textContent = hpDisplay;
        }

        // 生成隨機對象
        function spawnObstacles() {
            if (Math.random() < 0.02 + game.level * 0.01) {
                obstacles.push(new Obstacle());
            }
        }

        function spawnRewards() {
            if (Math.random() < 0.01 + game.level * 0.002) {
                rewards.push(new Reward());
            }
        }

        // 遊戲循環
        function gameLoop() {
            if (!game.running) return;

            // 清空畫布
            ctx.fillStyle = 'rgba(26, 26, 46, 0.2)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 更新和繪製粒子
            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update();
                particles[i].draw();
                if (particles[i].life <= 0) particles.splice(i, 1);
            }

            // 生成對象
            spawnObstacles();
            spawnRewards();

            // 更新和繪製隕石
            for (let i = obstacles.length - 1; i >= 0; i--) {
                obstacles[i].update();
                obstacles[i].draw();

                if (obstacles[i].collidesWith(game.playerX, game.playerY, game.playerSize)) {
                    game.hp--;
                    for (let j = 0; j < 10; j++) {
                        particles.push(new Particle(
                            game.playerX, game.playerY,
                            (Math.random() - 0.5) * 4, Math.random() * 2 - 4,
                            'rgb(255, 100, 100)', 20
                        ));
                    }
                    obstacles.splice(i, 1);

                    if (game.hp <= 0) {
                        endGame();
                        return;
                    }
                    continue;
                }

                if (obstacles[i].y > canvas.height) {
                    obstacles.splice(i, 1);
                    game.score += 5;
                }
            }

            // 更新和繪製獎勵
            for (let i = rewards.length - 1; i >= 0; i--) {
                rewards[i].update();
                rewards[i].draw();

                if (rewards[i].collidesWith(game.playerX, game.playerY, game.playerSize)) {
                    game.score += 25;
                    for (let j = 0; j < 15; j++) {
                        particles.push(new Particle(
                            rewards[i].x, rewards[i].y,
                            (Math.random() - 0.5) * 6, Math.random() * 2 - 4,
                            'rgb(255, 215, 0)', 25
                        ));
                    }
                    rewards.splice(i, 1);

                    if (game.score % 100 === 0) {
                        game.level++;
                    }
                    continue;
                }

                if (rewards[i].y > canvas.height) {
                    rewards.splice(i, 1);
                }
            }

            // 繪製玩家
            drawPlayer();

            // 更新UI
            updateUI();

            requestAnimationFrame(gameLoop);
        }

        function endGame() {
            game.running = false;
            document.getElementById('gameOverScreen').style.display = 'block';
            document.getElementById('finalScore').textContent = game.score;
            document.getElementById('finalLevel').textContent = game.level;

            // 根據分數顯示不同的訊息
            const title = document.getElementById('gameOverTitle');
            if (game.score > 500) {
                title.textContent = '你是傳奇太空人！🌟';
            } else if (game.score > 250) {
                title.textContent = '太棒了！你是真正的英雄！⭐';
            } else if (game.score > 100) {
                title.textContent = '不錯！再試試看吧！💪';
            } else {
                title.textContent = '再接再厲！😄';
            }
        }

        // 開始遊戲
        gameLoop();
    </script>
</body>
</html>
