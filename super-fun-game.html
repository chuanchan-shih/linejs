<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🚀 太空閃躲者 - Space Dodger</title>
    <style>
        :root {
            --void: #05060d;
            --panel: #10142a;
            --panel-edge: #232a52;
            --screen-top: #060913;
            --screen-bottom: #12183a;
            --cyan: #5eead4;
            --cyan-dim: #2f9c8a;
            --gold: #f5c451;
            --gold-dim: #c98f2e;
            --danger: #fb5b6e;
            --danger-dim: #e03a52;
            --ink: #eef2ff;
            --ink-dim: #8b93b8;
            --mono: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
            --display: 'Arial Narrow', 'Helvetica Neue', Arial, sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background:
                radial-gradient(ellipse at 50% -10%, #1a2050 0%, transparent 55%),
                var(--void);
            font-family: var(--display);
            color: var(--ink);
        }

        .container {
            text-align: center;
            background: linear-gradient(180deg, var(--panel) 0%, #0a0d1e 100%);
            padding: 22px 26px 26px;
            border-radius: 22px;
            border: 1px solid var(--panel-edge);
            box-shadow:
                0 0 0 1px rgba(94, 234, 212, 0.06),
                0 30px 60px rgba(0, 0, 0, 0.55),
                inset 0 1px 0 rgba(255, 255, 255, 0.04);
        }

        h1 {
            color: var(--ink);
            margin-bottom: 14px;
            font-size: 1.9em;
            font-weight: 800;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            text-shadow: 0 0 18px rgba(94, 234, 212, 0.45);
        }

        canvas {
            border: 2px solid var(--panel-edge);
            display: block;
            background: linear-gradient(to bottom, var(--screen-top) 0%, var(--screen-bottom) 100%);
            cursor: crosshair;
            box-shadow:
                inset 0 0 40px rgba(0, 0, 0, 0.6),
                0 0 24px rgba(94, 234, 212, 0.12);
            border-radius: 10px;
            margin: 18px auto;
        }

        .info {
            display: flex;
            justify-content: space-around;
            font-family: var(--mono);
            font-variant-numeric: tabular-nums;
            font-size: 1.05em;
            color: var(--ink-dim);
            letter-spacing: 0.03em;
        }

        .info div {
            display: flex;
            gap: 0.5em;
        }

        .score { color: var(--gold); font-weight: 700; }
        .level { color: var(--cyan); font-weight: 700; }
        .hp { font-weight: 700; }

        .controls {
            color: var(--ink-dim);
            margin-top: 14px;
            font-size: 0.85em;
            font-family: var(--mono);
            line-height: 1.6;
        }

        button {
            margin-top: 16px;
            padding: 11px 28px;
            font-family: var(--display);
            font-size: 1em;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            background: transparent;
            color: var(--cyan);
            border: 1.5px solid var(--cyan-dim);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        button:hover {
            background: rgba(94, 234, 212, 0.1);
            border-color: var(--cyan);
            box-shadow: 0 0 16px rgba(94, 234, 212, 0.35);
        }

        button:active {
            transform: translateY(1px);
        }

        .game-over {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: linear-gradient(180deg, var(--panel) 0%, #0a0d1e 100%);
            color: var(--ink);
            padding: 40px 44px;
            border-radius: 18px;
            border: 1px solid var(--panel-edge);
            text-align: center;
            display: none;
            z-index: 1000;
            box-shadow:
                0 0 0 1px rgba(251, 91, 110, 0.1),
                0 30px 70px rgba(0, 0, 0, 0.7);
        }

        .game-over h2 {
            font-size: 1.8em;
            font-weight: 800;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            margin-bottom: 20px;
            color: var(--danger);
            text-shadow: 0 0 20px rgba(251, 91, 110, 0.4);
        }

        .game-over p {
            font-size: 1.1em;
            margin: 10px 0;
            font-family: var(--mono);
            color: var(--ink-dim);
        }

        .game-over strong {
            color: var(--gold);
            font-variant-numeric: tabular-nums;
        }

        .game-over button {
            margin-top: 20px;
        }

        .tip {
            color: var(--gold-dim);
            font-size: 0.8em;
            margin-top: 10px;
            font-family: var(--mono);
        }

        .selectors {
            margin-top: 18px;
            text-align: left;
        }

        .selector-row {
            margin-bottom: 12px;
        }

        .selector-row:last-child {
            margin-bottom: 0;
        }

        .selector-label {
            font-family: var(--mono);
            font-size: 0.75em;
            color: var(--ink-dim);
            letter-spacing: 0.08em;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .selector-options {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .skin-btn, .theme-btn {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            border: 1.5px solid var(--panel-edge);
            background: rgba(255, 255, 255, 0.03);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s ease;
            padding: 0;
        }

        .skin-btn:hover, .theme-btn:hover {
            border-color: var(--cyan-dim);
        }

        .skin-btn.active, .theme-btn.active {
            border-color: var(--cyan);
            box-shadow: 0 0 12px rgba(94, 234, 212, 0.4);
        }

        .skin-swatch {
            width: 0;
            height: 0;
            border-left: 8px solid transparent;
            border-right: 8px solid transparent;
            border-bottom: 16px solid var(--sw);
            filter: drop-shadow(0 0 3px var(--sw));
        }

        .theme-swatch {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: linear-gradient(180deg, var(--sw-top) 0%, var(--sw-bottom) 100%);
            box-shadow: inset 0 0 4px rgba(0, 0, 0, 0.6);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>太空閃躲者</h1>
        <div class="info">
            <div>SCORE <span class="score">0</span></div>
            <div>LV <span class="level">1</span></div>
            <div>HP <span class="hp">❤️❤️❤️</span></div>
        </div>
        <canvas id="gameCanvas" width="600" height="600"></canvas>
        <div class="controls">
            <p>移動滑鼠控制太空船 · 收集金星加分 · 閃躲隕石</p>
        </div>

        <div class="selectors">
            <div class="selector-row">
                <div class="selector-label">太空船塗裝</div>
                <div class="selector-options" id="skinOptions"></div>
            </div>
            <div class="selector-row">
                <div class="selector-label">背景主題</div>
                <div class="selector-options" id="themeOptions"></div>
            </div>
        </div>

        <button onclick="location.reload()">重新開始</button>
        <div class="tip">等級越高，隕石越多越快</div>
    </div>

    <div class="game-over" id="gameOverScreen">
        <h2 id="gameOverTitle">遊戲結束</h2>
        <p>最終分數 <strong id="finalScore">0</strong></p>
        <p>達到等級 <strong id="finalLevel">1</strong></p>
        <button onclick="location.reload()">再玩一次</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // 太空船塗裝
        const SKINS = [
            { name: '經典青', body: '#5eead4', edge: '#2f9c8a', flame: '245, 196, 81' },
            { name: '烈焰紅', body: '#fb5b6e', edge: '#c23349', flame: '255, 168, 64' },
            { name: '黃金鷹', body: '#f5c451', edge: '#c98f2e', flame: '94, 234, 212' },
            { name: '幽靈紫', body: '#a78bfa', edge: '#6d28d9', flame: '244, 114, 182' },
            { name: '極地白', body: '#f4f7ff', edge: '#94a3c4', flame: '94, 180, 255' },
        ];

        // 背景主題
        const THEMES = [
            { name: '深空藍', top: '#060913', bottom: '#12183a', trail: '26, 26, 46' },
            { name: '星雲紫', top: '#0d0620', bottom: '#2a1250', trail: '32, 16, 48' },
            { name: '極光綠', top: '#031b12', bottom: '#0f3d2c', trail: '10, 32, 26' },
            { name: '熔岩橘', top: '#1a0a02', bottom: '#3d1a08', trail: '36, 18, 10' },
            { name: '虛空黑', top: '#000000', bottom: '#0a0a0d', trail: '8, 8, 10' },
        ];

        function clampIndex(value, length) {
            const n = parseInt(value, 10);
            return (Number.isInteger(n) && n >= 0 && n < length) ? n : 0;
        }

        // 遊戲狀態
        const game = {
            running: true,
            score: 0,
            level: 1,
            hp: 3,
            maxHp: 3,
            playerX: canvas.width / 2,
            playerY: canvas.height - 50,
            playerSize: 30,
            playerSpeed: 6,
            skinIndex: clampIndex(localStorage.getItem('sd_skin'), SKINS.length),
            themeIndex: clampIndex(localStorage.getItem('sd_theme'), THEMES.length),
        };

        function applyTheme() {
            const theme = THEMES[game.themeIndex];
            canvas.style.background = `linear-gradient(to bottom, ${theme.top} 0%, ${theme.bottom} 100%)`;
        }

        function buildSelectors() {
            const skinContainer = document.getElementById('skinOptions');
            SKINS.forEach((skin, i) => {
                const btn = document.createElement('button');
                btn.className = 'skin-btn' + (i === game.skinIndex ? ' active' : '');
                btn.title = skin.name;
                btn.style.setProperty('--sw', skin.body);
                btn.innerHTML = '<span class="skin-swatch"></span>';
                btn.onclick = () => {
                    game.skinIndex = i;
                    localStorage.setItem('sd_skin', i);
                    skinContainer.querySelectorAll('.skin-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                };
                skinContainer.appendChild(btn);
            });

            const themeContainer = document.getElementById('themeOptions');
            THEMES.forEach((theme, i) => {
                const btn = document.createElement('button');
                btn.className = 'theme-btn' + (i === game.themeIndex ? ' active' : '');
                btn.title = theme.name;
                btn.style.setProperty('--sw-top', theme.top);
                btn.style.setProperty('--sw-bottom', theme.bottom);
                btn.innerHTML = '<span class="theme-swatch"></span>';
                btn.onclick = () => {
                    game.themeIndex = i;
                    localStorage.setItem('sd_theme', i);
                    themeContainer.querySelectorAll('.theme-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    applyTheme();
                };
                themeContainer.appendChild(btn);
            });
        }

        buildSelectors();
        applyTheme();

        // 粒子效果
        const particles = [];
        class Particle {
            constructor(x, y, vx, vy, color, life = 30) {
                this.x = x;
                this.y = y;
                this.vx = vx;
                this.vy = vy;
                this.color = color;
                this.life = life;
                this.maxLife = life;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vy += 0.2;
                this.life--;
            }

            draw() {
                const alpha = this.life / this.maxLife;
                ctx.fillStyle = this.color.replace(')', `, ${alpha})`).replace('rgb', 'rgba');
                ctx.beginPath();
                ctx.arc(this.x, this.y, 3, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // 障礙物 (隕石)
        const obstacles = [];
        class Obstacle {
            constructor() {
                this.x = Math.random() * (canvas.width - 40);
                this.y = -40;
                this.size = 30 + Math.random() * 20;
                this.speed = 2 + game.level * 0.5;
                this.rotation = Math.random() * Math.PI * 2;
                this.rotationSpeed = (Math.random() - 0.5) * 0.1;
            }

            update() {
                this.y += this.speed;
                this.rotation += this.rotationSpeed;
            }

            draw() {
                ctx.save();
                ctx.translate(this.x + this.size / 2, this.y + this.size / 2);
                ctx.rotate(this.rotation);

                ctx.fillStyle = '#fb5b6e';
                ctx.beginPath();
                for (let i = 0; i < 6; i++) {
                    const angle = (i / 6) * Math.PI * 2;
                    const x = Math.cos(angle) * this.size / 2;
                    const y = Math.sin(angle) * this.size / 2;
                    if (i === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }
                ctx.closePath();
                ctx.fill();
                ctx.strokeStyle = '#e03a52';
                ctx.lineWidth = 2;
                ctx.stroke();

                ctx.restore();
            }

            collidesWith(playerX, playerY, playerSize) {
                const dx = (this.x + this.size / 2) - playerX;
                const dy = (this.y + this.size / 2) - playerY;
                const distance = Math.sqrt(dx * dx + dy * dy);
                return distance < (this.size / 2 + playerSize / 2);
            }
        }

        // 獎勵 (星星)
        const rewards = [];
        class Reward {
            constructor() {
                this.x = Math.random() * (canvas.width - 30);
                this.y = -30;
                this.size = 20;
                this.speed = 1.5;
                this.rotation = 0;
                this.wobble = Math.random() * Math.PI * 2;
                this.wobbleSpeed = 0.05;
            }

            update() {
                this.y += this.speed;
                this.wobble += this.wobbleSpeed;
                this.x += Math.sin(this.wobble) * 0.5;
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.fillStyle = '#f5c451';
                ctx.beginPath();
                for (let i = 0; i < 5; i++) {
                    const angle = (i / 5) * Math.PI * 2 - Math.PI / 2;
                    const x = Math.cos(angle) * this.size;
                    const y = Math.sin(angle) * this.size;
                    if (i === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);

                    const innerAngle = angle + Math.PI / 5;
                    const ix = Math.cos(innerAngle) * (this.size / 2);
                    const iy = Math.sin(innerAngle) * (this.size / 2);
                    ctx.lineTo(ix, iy);
                }
                ctx.closePath();
                ctx.fill();
                ctx.strokeStyle = '#c98f2e';
                ctx.lineWidth = 2;
                ctx.stroke();

                ctx.restore();
            }

            collidesWith(playerX, playerY, playerSize) {
                const dx = this.x - playerX;
                const dy = this.y - playerY;
                const distance = Math.sqrt(dx * dx + dy * dy);
                return distance < (this.size + playerSize / 2);
            }
        }

        // 玩家 (太空船)
        function drawPlayer() {
            const skin = SKINS[game.skinIndex];
            ctx.save();
            ctx.translate(game.playerX, game.playerY);

            // 船身
            ctx.fillStyle = skin.body;
            ctx.beginPath();
            ctx.moveTo(0, -25);
            ctx.lineTo(15, 20);
            ctx.lineTo(0, 10);
            ctx.lineTo(-15, 20);
            ctx.closePath();
            ctx.fill();

            ctx.strokeStyle = skin.edge;
            ctx.lineWidth = 2;
            ctx.stroke();

            // 火焰
            const flameHeight = 15 + Math.sin(Date.now() / 50) * 5;
            ctx.fillStyle = `rgba(${skin.flame}, 0.75)`;
            ctx.beginPath();
            ctx.moveTo(-8, 10);
            ctx.lineTo(-3, 10 + flameHeight);
            ctx.lineTo(0, 15);
            ctx.lineTo(3, 10 + flameHeight);
            ctx.lineTo(8, 10);
            ctx.closePath();
            ctx.fill();

            ctx.restore();
        }

        // 滑鼠移動控制
        document.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            game.playerX = Math.max(game.playerSize / 2,
                Math.min(canvas.width - game.playerSize / 2, e.clientX - rect.left));
        });

        // 觸屏支持
        document.addEventListener('touchmove', (e) => {
            const rect = canvas.getBoundingClientRect();
            const touch = e.touches[0];
            game.playerX = Math.max(game.playerSize / 2,
                Math.min(canvas.width - game.playerSize / 2, touch.clientX - rect.left));
        }, { passive: true });

        // 更新分數和HP顯示
        function updateUI() {
            document.querySelector('.score').textContent = game.score;
            document.querySelector('.level').textContent = game.level;
            let hpDisplay = '';
            for (let i = 0; i < game.hp; i++) hpDisplay += '❤️ ';
            document.querySelector('.hp').textContent = hpDisplay;
        }

        // 生成隨機對象
        function spawnObstacles() {
            if (Math.random() < 0.02 + game.level * 0.01) {
                obstacles.push(new Obstacle());
            }
        }

        function spawnRewards() {
            if (Math.random() < 0.01 + game.level * 0.002) {
                rewards.push(new Reward());
            }
        }

        // 遊戲循環
        function gameLoop() {
            if (!game.running) return;

            // 清空畫布
            ctx.fillStyle = `rgba(${THEMES[game.themeIndex].trail}, 0.2)`;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 更新和繪製粒子
            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update();
                particles[i].draw();
                if (particles[i].life <= 0) particles.splice(i, 1);
            }

            // 生成對象
            spawnObstacles();
            spawnRewards();

            // 更新和繪製隕石
            for (let i = obstacles.length - 1; i >= 0; i--) {
                obstacles[i].update();
                obstacles[i].draw();

                if (obstacles[i].collidesWith(game.playerX, game.playerY, game.playerSize)) {
                    game.hp--;
                    for (let j = 0; j < 10; j++) {
                        particles.push(new Particle(
                            game.playerX, game.playerY,
                            (Math.random() - 0.5) * 4, Math.random() * 2 - 4,
                            'rgb(251, 91, 110)', 20
                        ));
                    }
                    obstacles.splice(i, 1);

                    if (game.hp <= 0) {
                        endGame();
                        return;
                    }
                    continue;
                }

                if (obstacles[i].y > canvas.height) {
                    obstacles.splice(i, 1);
                    game.score += 5;
                }
            }

            // 更新和繪製獎勵
            for (let i = rewards.length - 1; i >= 0; i--) {
                rewards[i].update();
                rewards[i].draw();

                if (rewards[i].collidesWith(game.playerX, game.playerY, game.playerSize)) {
                    game.score += 25;
                    for (let j = 0; j < 15; j++) {
                        particles.push(new Particle(
                            rewards[i].x, rewards[i].y,
                            (Math.random() - 0.5) * 6, Math.random() * 2 - 4,
                            'rgb(245, 196, 81)', 25
                        ));
                    }
                    rewards.splice(i, 1);
                    continue;
                }

                if (rewards[i].y > canvas.height) {
                    rewards.splice(i, 1);
                }
            }

            // 根據分數更新等級
            game.level = Math.floor(game.score / 100) + 1;

            // 繪製玩家
            drawPlayer();

            // 更新UI
            updateUI();

            requestAnimationFrame(gameLoop);
        }

        function endGame() {
            game.running = false;
            document.getElementById('gameOverScreen').style.display = 'block';
            document.getElementById('finalScore').textContent = game.score;
            document.getElementById('finalLevel').textContent = game.level;

            // 根據分數顯示不同的訊息
            const title = document.getElementById('gameOverTitle');
            if (game.score > 500) {
                title.textContent = '你是傳奇太空人！🌟';
            } else if (game.score > 250) {
                title.textContent = '太棒了！你是真正的英雄！⭐';
            } else if (game.score > 100) {
                title.textContent = '不錯！再試試看吧！💪';
            } else {
                title.textContent = '再接再厲！😄';
            }
        }

        // 開始遊戲
        gameLoop();
    </script>
</body>
</html>
